<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Majapahit Platformer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #1a0f08;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: monospace;
    }
    #container {
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    #canvas {
      /* image-rendering wajib nearest-neighbor untuk pixel art */
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      display: block;
      cursor: none;
    }
    #loading-bar-wrap {
      /* Lebar mengikuti canvas yang sudah di-scale — gunakan max-width fleksibel */
      width: min(100vw, 960px);
      max-width: 960px;
      height: 8px;
      background: #2B1810;
      border: 1px solid #C1440E;
    }
    #loading-bar {
      height: 100%;
      width: 0%;
      background: #C1440E;
      transition: width 0.1s linear;
    }
    #loading-text {
      color: #F0EBD8;
      font-size: 10px;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
<div id="container">
  <canvas id="canvas"></canvas>
  <div id="loading-bar-wrap"><div id="loading-bar"></div></div>
  <div id="loading-text">MEMUAT ASSETS...</div>
</div>

<script type="module" src="src/engine/main.js"></script>
</body>
</html>
